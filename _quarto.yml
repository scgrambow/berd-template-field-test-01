project:
  type: book
  output-dir: docs

book:
  title: "IVAM-ED: A CRP 241 Teaching Case"
  subtitle: "A Complete Analysis Tutorial for Introductory Clinical Research Methods"
  author: "CRP 241 — Duke University"
  date: today
  site-url: https://scgrambow.github.io/berd-template-field-test-01/
  repo-url: https://github.com/scgrambow/berd-template-field-test-01
  repo-actions: [edit, issue]
  search: true
  chapters:
    - index.qmd
    - part: "Analysis Modules"
      chapters:
        - R/01-data-setup.qmd
        - R/02-descriptive.qmd
        - R/03-visualization.qmd
        - R/04-estimation.qmd
        - R/05-ancova.qmd
        - R/06-missing-data.qmd
        - R/07-interpretation.qmd
        - R/08-capstone.qmd
  appendices:
    - R/A1-answer-key.qmd
    - references.qmd

format:
  html:
    theme: flatly
    toc: true
    toc-depth: 3
    code-fold: false
    embed-resources: false

execute:
  echo: true
  warning: false
  message: false
