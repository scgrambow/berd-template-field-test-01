name: Render and publish Quarto book

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual runs from GitHub Actions tab

permissions:
  contents: write   # needed to commit docs/ back to main

jobs:
  render-book:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Generate synthetic dataset
        run: Rscript R/simulate-ivam-ed.R

      - name: Render book
        run: quarto render

      - name: Commit and push rendered docs/
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff --staged --quiet || git commit -m "ci: re-render book [skip ci]"
          git push
