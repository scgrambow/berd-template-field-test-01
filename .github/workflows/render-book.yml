name: Render and publish Quarto book

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual runs from GitHub Actions tab

permissions:
  contents: write   # needed to commit docs/ back to main

jobs:
  render-book:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up R
        uses: r-lib/actions/setup-r@929c772977a3a13c8733b363bf5a2f685c25dd91 # v2.9.0
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.10.18

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@929c772977a3a13c8733b363bf5a2f685c25dd91 # v2.9.0

      - name: Generate synthetic dataset
        run: Rscript R/simulate-ivam-ed.R

      - name: Render book
        run: quarto render

      - name: Commit and push rendered docs/
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff --staged --quiet || git commit -m "ci: re-render book [skip ci]"
          git push
